spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/livrio}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  address: 0.0.0.0
  port: ${PORT:8089}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000 # 1 day

cors:
  origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:57533,http://10.0.2.2:8089}
